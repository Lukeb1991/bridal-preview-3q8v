<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="robots" content="noindex, nofollow">

<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="favicon-180.png">
<meta name="theme-color" content="#0E090A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Deema’s Games">
<title>Deema’s Crossword — Deema’s Bridal Shower</title>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="theme.css">
</head>
<body data-title="games.mini.title">

<div class="confetti"></div>

<div class="wrap xw-wrap">

  <div class="game-header">
    <a class="back-link" href="index.html" aria-label="Back to games"><span class="arrow">&larr;</span><span class="back-label" data-cfg="site.backLabel">Games</span></a>
    <h1 class="game-title" data-cfg="games.mini.title">Deema’s Crossword</h1>
    <span class="xw-timer" id="timer" role="timer" aria-label="Time taken">0:00</span>
  </div>
  <p class="game-sub" data-cfg="games.mini.sub">It’s all about the Bride</p>

  <div class="xw-board" id="board"></div>

  <div class="xw-cluebar">
    <button class="xw-nav-arrow" id="prevClue" aria-label="Previous clue">&#8249;</button>
    <div class="xw-clue-text" id="clueText">&nbsp;</div>
    <button class="xw-nav-arrow" id="nextClue" aria-label="Next clue">&#8250;</button>
  </div>

  <div class="keyboard xw-keyboard" id="keyboard"></div>

  <div class="xw-toolbar">
    <button class="pill-btn ghost" id="checkBtn">Check</button>
    <button class="pill-btn ghost" id="revealBtn">Reveal</button>
    <button class="pill-btn ghost" id="clearBtn">Clear</button>
  </div>

</div>

<div class="toast" id="toast"></div>

<!-- Win modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="win-modal">
    <div class="win-seal">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2c.6 3.6 2.4 5.4 6 6-3.6.6-5.4 2.4-6 6-.6-3.6-2.4-5.4-6-6 3.6-.6 5.4-2.4 6-6Z" fill="#fff"/>
        <path d="M19 15c.3 1.8 1.2 2.7 3 3-1.8.3-2.7 1.2-3 3-.3-1.8-1.2-2.7-3-3 1.8-.3 2.7-1.2 3-3Z" fill="#fff" opacity="0.85"/>
      </svg>
    </div>
    <h2 id="winTitle"></h2>
    <p id="winSub"></p>
    <p class="share-line share-head" id="shareLine"></p>
    <p class="share-line share-close" id="shareClose"></p>
    <div class="share-row" id="shareRow">
      <button class="share-btn whatsapp" id="shareWhatsapp">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38a9.87 9.87 0 0 0 4.74 1.21h.01c5.46 0 9.9-4.45 9.9-9.91C21.96 6.45 17.5 2 12.04 2Z"/></svg>
        Share on WhatsApp
      </button>
      <button class="share-btn native" id="shareNative">&#128241; Share</button>
      <button class="share-btn copy" id="shareCopy">Copy message</button>
    </div>
    <button class="play-again-btn" id="playAgainBtn">&#8635; Play again</button>
  </div>
</div>

<script src="config.js"></script>
<script src="confetti.js"></script>
<script src="haptics.js"></script>
<script src="common.js"></script>
<script>
/* Grid, answers and clues come from config.js (GAME_CONFIG.mini).
   Numbering is generated automatically from the layout. */
const CFG = GAME_CONFIG.mini;
const LAYOUT = CFG.layout;
const ANSWERS = CFG.answers;
const CLUES = CFG.clues;

const R = LAYOUT.length, C = LAYOUT[0].length;
const isBlock = (r,c) => LAYOUT[r][c] === '#';

// ---- build entries + numbering ----
const numberAt = {};
const entries = [];
let numCounter = 1;

for(let r=0;r<R;r++){
  for(let c=0;c<C;c++){
    if(isBlock(r,c)) continue;
    const startsAcross = (c===0 || isBlock(r,c-1)) && (c+1<C && !isBlock(r,c+1));
    const startsDown    = (r===0 || isBlock(r-1,c)) && (r+1<R && !isBlock(r+1,c));
    if(startsAcross || startsDown){
      numberAt[`${r},${c}`] = numCounter;
      if(startsAcross){
        const cells=[]; let cc=c;
        while(cc<C && !isBlock(r,cc)){ cells.push([r,cc]); cc++; }
        const key = `${r},${c},A`;
        entries.push({num:numCounter, dir:'A', r, c, cells, answer:(ANSWERS[key]||'').toUpperCase(), clue:CLUES[key]||''});
      }
      if(startsDown){
        const cells=[]; let rr=r;
        while(rr<R && !isBlock(rr,c)){ cells.push([rr,c]); rr++; }
        const key = `${r},${c},D`;
        entries.push({num:numCounter, dir:'D', r, c, cells, answer:(ANSWERS[key]||'').toUpperCase(), clue:CLUES[key]||''});
      }
      numCounter++;
    }
  }
}
// navigation order: by number, across before down
const navOrder = [...entries].sort((a,b)=> a.num - b.num || (a.dir==='A'?-1:1));

// the correct letter for every square (used by Check)
const solution = {};
entries.forEach(e => e.cells.forEach(([r,c], i)=>{ if(e.answer) solution[`${r},${c}`] = e.answer[i]; }));

// ---- state ----
const letters = {};
const wrong = {};       // squares Check has crossed out; cleared when the square is edited
let currentEntry = navOrder[0];
let currentPos = currentEntry.cells[0];
let finished = false;   // true once solved or revealed (stops repeat wins)
let won = false;        // solved by the player (not revealed)
let revealed = false;
let gen = 0;            // bumps on Clear so a pending win pop-up can be cancelled

// ---- timer: starts with the first letter, stops when solved or revealed ----
const timerEl = document.getElementById('timer');
let timerStart = null, timerId = null, elapsed = 0;
function fmt(s){ return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0'); }
function tick(){
  elapsed = Math.floor((Date.now() - timerStart) / 1000);
  timerEl.textContent = fmt(elapsed);
}
function startTimer(){
  if(timerStart !== null || finished) return;
  timerStart = Date.now();
  timerEl.classList.add('running');
  tick();
  timerId = setInterval(tick, 250);
}
function stopTimer(){
  if(timerId){ clearInterval(timerId); timerId = null; }
  if(timerStart !== null) tick();
  timerEl.classList.remove('running');
}
function resetTimer(){
  stopTimer();
  timerStart = null; elapsed = 0;
  timerEl.textContent = '0:00';
  timerEl.classList.remove('done');
}

function entriesAt(r,c){
  return entries.filter(e => e.cells.some(([er,ec]) => er===r && ec===c));
}
function keyOf(r,c){ return `${r},${c}`; }

// ---- render grid ----
const boardEl = document.getElementById('board');
boardEl.style.gridTemplateColumns = `repeat(${C}, 1fr)`;
const cellEls = {};

for(let r=0;r<R;r++){
  for(let c=0;c<C;c++){
    const cell = document.createElement('div');
    cell.className = 'xw-cell';
    if(isBlock(r,c)){
      cell.classList.add('block');
    } else {
      const key = keyOf(r,c);
      if(numberAt[key]){
        const n = document.createElement('span');
        n.className = 'xw-num';
        n.textContent = numberAt[key];
        cell.appendChild(n);
      }
      const letterSpan = document.createElement('span');
      letterSpan.className = 'xw-letter';
      cell.appendChild(letterSpan);
      cell.addEventListener('click', ()=> cellClicked(r,c));
      cellEls[key] = { cell, letterSpan };
    }
    boardEl.appendChild(cell);
  }
}

function cellClicked(r,c){
  haptic(6);
  const here = entriesAt(r,c);
  if(here.length === 0) return;
  const samePos = currentPos[0]===r && currentPos[1]===c;
  if(samePos && here.length > 1){
    currentEntry = here.find(e => e !== currentEntry) || here[0];   // tap again = flip direction
  } else if(here.includes(currentEntry)){
    // stay in the same word, just move the cursor
  } else {
    currentEntry = here.find(e => e.dir === currentEntry.dir) || here[0];
  }
  currentPos = [r,c];
  renderState();
}

function renderState(){
  Object.values(cellEls).forEach(({cell}) => cell.classList.remove('active-word','active-cell'));
  currentEntry.cells.forEach(([r,c])=>{
    const el = cellEls[keyOf(r,c)];
    if(el) el.cell.classList.add('active-word');
  });
  const curEl = cellEls[keyOf(currentPos[0],currentPos[1])];
  if(curEl) curEl.cell.classList.add('active-cell');

  const dirWord = currentEntry.dir === 'A' ? 'Across' : 'Down';
  document.getElementById('clueText').textContent =
    `${currentEntry.num} ${dirWord}. ${currentEntry.clue}`;
}

function renderLetters(){
  Object.entries(cellEls).forEach(([key, {cell, letterSpan}])=>{
    letterSpan.textContent = letters[key] || '';
    cell.classList.toggle('wrong', !!wrong[key] && !!letters[key]);   // red line through a letter Check found wrong
  });
}

function moveWithinEntry(delta){
  const idx = currentEntry.cells.findIndex(([r,c])=> r===currentPos[0] && c===currentPos[1]);
  const newIdx = idx + delta;
  if(newIdx >= 0 && newIdx < currentEntry.cells.length){
    currentPos = currentEntry.cells[newIdx];
    renderState();
  }
}

function typeLetter(ch){
  const key = keyOf(currentPos[0], currentPos[1]);
  startTimer();
  letters[key] = ch;
  delete wrong[key];
  renderLetters();
  haptic(6);
  moveWithinEntry(1);
  maybeAutoCheck();
}

function deleteLetter(){
  const key = keyOf(currentPos[0], currentPos[1]);
  if(letters[key]){
    letters[key] = '';
    delete wrong[key];
    renderLetters();
    haptic(8);
  } else {
    moveWithinEntry(-1);
    const k2 = keyOf(currentPos[0], currentPos[1]);
    letters[k2] = '';
    delete wrong[k2];
    renderLetters();
    haptic(8);
  }
}

document.addEventListener('keydown', (e)=>{
  if(e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toUpperCase();
  if(/^[A-Z]$/.test(k)){ typeLetter(k); }
  else if(e.key === 'Backspace'){ deleteLetter(); }
  else if(e.key === 'ArrowRight' || e.key === 'ArrowDown'){ moveWithinEntry(1); }
  else if(e.key === 'ArrowLeft' || e.key === 'ArrowUp'){ moveWithinEntry(-1); }
});

// ---- on-screen keyboard ----
const KEY_ROWS = [
  "QWERTYUIOP".split(""),
  "ASDFGHJKL".split(""),
  [..."ZXCVBNM".split(""), 'DEL']
];
const keyboardEl = document.getElementById('keyboard');
KEY_ROWS.forEach(row=>{
  const rowEl = document.createElement('div');
  rowEl.className = 'key-row';
  row.forEach(k=>{
    const btn = document.createElement('button');
    btn.className = 'key' + (k === 'DEL' ? ' wide' : '');
    btn.textContent = k === 'DEL' ? 'Del' : k;
    btn.addEventListener('click', ()=>{
      if(k === 'DEL'){ deleteLetter(); } else { typeLetter(k); }
      btn.blur();
    });
    rowEl.appendChild(btn);
  });
  keyboardEl.appendChild(rowEl);
});

// ---- clue navigation ----
function gotoEntry(delta){
  const idx = navOrder.indexOf(currentEntry);
  currentEntry = navOrder[(idx + delta + navOrder.length) % navOrder.length];
  currentPos = currentEntry.cells[0];
  haptic(6);
  renderState();
}
document.getElementById('prevClue').addEventListener('click', ()=> gotoEntry(-1));
document.getElementById('nextClue').addEventListener('click', ()=> gotoEntry(1));

// ---- check / reveal / clear / auto-complete ----
const toastEl = document.getElementById('toast');
function showToast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  setTimeout(()=>toastEl.classList.remove('show'), 1600);
}

const modalOverlay = document.getElementById('modalOverlay');
const winSub = document.getElementById('winSub');
const shareLine = document.getElementById('shareLine');
const shareClose = document.getElementById('shareClose');
document.getElementById('winTitle').textContent = CFG.winTitle;
modalOverlay.addEventListener('click', (e)=>{ if(e.target === modalOverlay) modalOverlay.classList.remove('show'); });

// e.g. "Deema’s Bridal Crossword 1:23 ⏱️"
function resultLine(){ return `${CFG.shareTitle} ${fmt(elapsed)} ${CFG.shareEmoji}`; }
function shareText(){ return `${resultLine()}\n${CFG.shareLine}`; }

function openShare(){
  winSub.textContent = CFG.winSub.replace('{time}', fmt(elapsed));
  shareLine.textContent = resultLine();
  shareClose.textContent = CFG.shareLine;
  modalOverlay.classList.add('show');
}

document.getElementById('shareWhatsapp').addEventListener('click', ()=>{
  window.open('https://wa.me/?text=' + encodeURIComponent(shareText()), '_blank');
});
document.getElementById('shareNative').addEventListener('click', async ()=>{
  if(navigator.share){
    try{ await navigator.share({ text: shareText() }); } catch(e){ /* cancelled */ }
  } else { copyToClipboard(); }
});
document.getElementById('shareCopy').addEventListener('click', copyToClipboard);
function copyToClipboard(){
  navigator.clipboard.writeText(shareText()).then(()=>{
    showToast('Copied — paste it anywhere!');
  }).catch(()=>{
    showToast('Could not copy — try Share instead');
  });
}

function gridState(){
  let allFilled = true, allCorrect = true;
  for(let r=0;r<R;r++){
    for(let c=0;c<C;c++){
      if(!isBlock(r,c) && !letters[keyOf(r,c)]) allFilled = false;
    }
  }
  entries.forEach(e=>{
    const typed = e.cells.map(([r,c])=> letters[keyOf(r,c)] || ' ').join('');
    if(e.answer && typed !== e.answer) allCorrect = false;
  });
  return { allFilled, allCorrect };
}

function win(){
  const myGen = gen;
  finished = true; won = true;
  stopTimer();                               // the clock stops on the last letter
  timerEl.classList.add('done');
  haptic([15,40,15,40,25]);
  launchConfettiBurst();
  // short pause so the finished grid is seen before the pop-up covers it
  setTimeout(()=>{ if(myGen === gen) openShare(); }, 1100);
}

// Fires as you type: the moment the grid is full AND right, you win.
function maybeAutoCheck(){
  if(finished) return;
  const s = gridState();
  if(s.allFilled && s.allCorrect) win();
}

// CHECK works at any point: every letter typed so far is compared with the answer,
// and wrong ones get a red line through them (until you change that square).
document.getElementById('checkBtn').addEventListener('click', ()=>{
  if(won){ openShare(); return; }            // already solved: reopen the result
  if(revealed){ showToast('Answers are showing — tap Clear to start again'); return; }

  Object.keys(wrong).forEach(k => delete wrong[k]);
  let filled = 0, bad = 0;
  Object.keys(cellEls).forEach(key=>{
    const ch = letters[key];
    if(!ch) return;
    filled++;
    if(solution[key] && ch !== solution[key]){ wrong[key] = true; bad++; }
  });
  renderLetters();

  if(!filled){ showToast('Type a few letters, then tap Check'); return; }
  if(bad){
    haptic([10,30,10]);
    showToast(bad === 1 ? '1 letter is wrong — crossed out in red' : `${bad} letters are wrong — crossed out in red`);
    return;
  }
  const s = gridState();
  if(s.allFilled && s.allCorrect){ win(); return; }   // normally already caught as you type
  showToast('All correct so far — keep going');
});

document.getElementById('revealBtn').addEventListener('click', ()=>{
  entries.forEach(e=>{
    e.cells.forEach(([r,c], i)=>{ if(e.answer) letters[keyOf(r,c)] = e.answer[i]; });
  });
  Object.keys(wrong).forEach(k => delete wrong[k]);
  finished = true; revealed = true;           // revealed answers don't count as a win
  stopTimer();
  renderLetters();
  showToast('Answers revealed');
});

function resetPuzzle(){
  gen++;                                      // cancels a win pop-up that hasn't opened yet
  if(document.activeElement && document.activeElement !== document.body) document.activeElement.blur();
  modalOverlay.classList.remove('show');
  Object.keys(letters).forEach(k=> letters[k] = '');
  Object.keys(wrong).forEach(k => delete wrong[k]);
  finished = won = revealed = false;
  resetTimer();
  currentEntry = navOrder[0];                 // back to the first square
  currentPos = currentEntry.cells[0];
  renderLetters();
  renderState();
}
document.getElementById('clearBtn').addEventListener('click', ()=>{ resetPuzzle(); showToast('Cleared'); });
document.getElementById('playAgainBtn').addEventListener('click', resetPuzzle);

renderState();
renderLetters();
</script>
</body>
</html>
