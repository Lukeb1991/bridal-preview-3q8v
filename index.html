<body>

<div class="confetti"></div>

<div class="wrap">

  <p class="eyebrow" data-cfg="site.eyebrow">Dearly beloved, come play</p>
  <h1 class="masthead"><span data-cfg="site.mastheadTop">Deema’s</span><span class="amp" data-cfg="site.mastheadAccent">Bridal Shower</span></h1>
  <p class="subhead" data-cfg="site.subhead">The Bridal Shower Games
Saturday, November 7, 2026</p>

  <hr class="rule">

  <div class="tile-grid">

    <a class="tile" href="wordle.html">
      <img class="tile-icon" src="icon-wordle.svg" alt="" aria-hidden="true">
      <h2 data-cfg="games.wordle.title">Wordle</h2>
      <p data-cfg="games.wordle.sub">Six tries to say “I do.”</p>
      <span class="tag" data-cfg="games.wordle.tag">5 letters</span>
    </a>

    <a class="tile" href="connections.html">
      <img class="tile-icon" src="icon-connections.svg" alt="" aria-hidden="true">
      <h2 data-cfg="games.connections.title">Connections</h2>
      <p data-cfg="games.connections.sub">Sixteen words. Four secrets.</p>
      <span class="tag" data-cfg="games.connections.tag">4 groups</span>
    </a>

    <a class="tile" href="crossword.html">
      <img class="tile-icon" src="icon-mini.svg" alt="" aria-hidden="true">
      <h2 data-cfg="games.mini.tileTitle">Mini</h2>
      <p data-cfg="games.mini.sub">A little crossword, all about Deema.</p>
      <span class="tag" data-cfg="games.mini.tag">5 × 5</span>
    </a>

  </div>

  <footer class="foot" data-cfg="site.footer">made with love for Deema</footer>

</div>
